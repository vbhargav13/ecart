<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shopping Cart – E-Shop</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <h2>Shopping Cart</h2>
  <div id="cart-container" class="cart-container"></div>
  <button onclick="clearCart()">Clear Cart</button>

<script>
  function clearCart() {
    localStorage.removeItem('cart');
    alert('Cart has been cleared!');
    location.reload(); // Refresh to update UI
  }
</script>

  <button onclick="location.href='payment.html'">Proceed to Payment</button>
</main>
<script src="script.js"></script>
</body>
</html>
