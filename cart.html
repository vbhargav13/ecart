<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shopping Cart – E-Shop</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <h2>Shopping Cart</h2>
  <div id="cart-container" class="cart-container"></div>
  <button onclick="clearCart()">Clear Cart</button>

<script>
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  let total = 0;
  let html = "<ul>";
  for (let item of cart) {
    html += `<li>${item.name} - ₹${item.price}</li>`;
    total += item.price;
  }
  html += "</ul>";
  html += `<p><strong>Total: ₹${total}</strong></p>`;
  html += `<a href='../order/payment.html'><button>Proceed to Pay</button></a>`;
  document.getElementById('cart-items').innerHTML = html;

  // ✅ Clear Cart Function
  function clearCart() {
    localStorage.removeItem('cart');
    alert('Cart has been cleared!');
    location.reload();
  }
</script>
</body>
</html>
