<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login – E-Shop</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <h2>Login</h2>
  <form id="login-form" class="form-container">
    <label>Email:<input type="email" id="login-email" required></label>
    <label>Password:<input type="password" id="login-password" required></label>
    <label><input type="checkbox" id="remember-me"> Remember Me</label>
    <p><a href="#">Forgot Password?</a></p>
    <button type="submit">Login</button>
  </form>
</main>
<script src="script.js"></script>
</body>
</html>
