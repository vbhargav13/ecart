<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #c3ecf7, #f5f7fa);
            padding: 40px;
            margin: 0;
        }
        .tracker-container {
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .tracker-container h2 {
            margin-bottom: 20px;
        }
        .tracker-container p {
            font-size: 16px;
            margin: 10px 0;
        }
        .order-id {
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="tracker-container">
        <h2>Order Tracker</h2>
        <!-- User’s address -->
        <p id="customer-address-display" style="font-weight:bold;"></p>
        <!-- Random 6-digit Order ID -->
        <p class="order-id">Order ID: <span id="orderId"></span></p>
        <!-- Randomized order status -->
        <p id="orderStatus"></p>
    </div>

    <script>
        function generateOrderId() {
            return Math.floor(100000 + Math.random() * 900000);
        }

        function getOrderStatus() {
            const steps = [
                "Order Received 📥",
                "Processing ⚙️",
                "Packed 📦",
                "Shipped 🚚",
                "Out for Delivery 📬",
                "Delivered 🎉"
            ];
            return steps[Math.floor(Math.random() * steps.length)];
        }

        // Populate Order ID & Status
        document.getElementById("orderId").innerText = generateOrderId();
        document.getElementById("orderStatus").innerText = "Current Status: " + getOrderStatus();

        // Pull and display delivery address from payment page
        const savedAddress = localStorage.getItem('customerAddress') || 'N/A';
        document.getElementById('customer-address-display').innerText =
            'Delivery Address: ' + savedAddress;
    </script>
</body>
</html>
