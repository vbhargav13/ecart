
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom right, #d2f1f7, #ffffff);
            text-align: center;
            padding: 80px 20px;
        }
        .confirmation-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #28a745;
            font-size: 2em;
        }
        p {
            font-size: 1.1em;
            color: #555;
        }
        .btn {
            display: inline-block;
            margin: 20px 10px 0 10px;
            padding: 12px 24px;
            background-color: #007bff;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="confirmation-box">
        <h1>🎉 Order Successfully Placed!</h1>
        <p>Your order has been confirmed. A confirmation email has been sent to your inbox.</p>
        <a class="btn" href="index(1).html">Continue Shopping</a>
        <a class="btn" href="order-tracker.html">Track Your Order</a>
    </div>

</html>
