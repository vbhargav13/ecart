<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Cart – E-Shop</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f0f8ff, #ffffff);
      margin: 0;
      padding: 40px;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    #cart-items {
      max-width: 600px;
      margin: 20px auto;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      padding: 30px;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    li {
      font-size: 18px;
      padding: 10px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
    }
    li:last-child {
      border-bottom: none;
    }
    strong {
      font-size: 20px;
    }
    .btn-container {
      text-align: center;
      margin-top: 20px;
    }
    button {
      background-color: #007bff;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      margin: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .clear-btn {
      background-color: #dc3545;
    }
    .clear-btn:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>
  <h2>Your Shopping Cart</h2>
  <div id="cart-items"></div>

  <div class="btn-container">
    <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
  </div>

  <script>
    function clearCart() {
      localStorage.removeItem('cart');
      alert('🧹 Cart has been cleared!');
      location.reload();
    }
  </script>

  <script>
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    let total = 0;
    let html = "<ul>";

    for (let item of cart) {
      html += `<li><span>${item.name}</span><span>₹${item.price}</span></li>`;
      total += item.price;
    }

    html += "</ul>";
    html += `<p style="text-align:right; font-size:18px;"><strong>Total: ₹${total}</strong></p>`;

    if (cart.length > 0) {
      html += `
        <div class="btn-container">
          <a href='../order/payment.html'>
            <button>Proceed to Pay</button>
          </a>
        </div>
      `;
    } else {
      html += `<p style="text-align:center; color:gray;">🛒 Your cart is empty.</p>`;
    }

    document.getElementById('cart-items').innerHTML = html;
  </script>
</body>
</html>
