<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign Up – E-Shop</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <h2>Sign Up</h2>
  <form id="signup-form" class="form-container">
    <label>Email:<input type="email" id="signup-email" required></label>
    <label>Password:<input type="password" id="signup-password" required></label>
    <label>Confirm Password:<input type="password" id="signup-confirm-password" required></label>
    <button type="submit">Sign Up</button>
  </form>
  <p>Already have an account? <a href="login.html">Login</a></p>
</main>
<script src="script.js"></script>
</body>
</html>
