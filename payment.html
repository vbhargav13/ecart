<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Payment – E-Shop</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <h2>Payment</h2>
  <form id="payment-form" class="form-container">
    <label>Name on Card:<input type="text" id="payment-name" required></label>
    <label>Card Number:<input type="text" id="payment-card" required></label>
    <label>Expiry Date:<input type="text" id="payment-expiry" placeholder="MM/YY" required></label>
    <label>CVV:<input type="text" id="payment-cvv" required></label>
    <button type="submit">Pay Now</button>
  </form>
</main>
<script src="script.js"></script>
</body>
</html>
